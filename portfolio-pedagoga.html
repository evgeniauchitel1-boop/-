    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-width: 280px; min-height: 100vh; background: var(--bg); color: var(--ink); font: 1rem/1.55 var(--body); }
    button, input, textarea, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid #d3e7ff; outline-offset: 4px; }
    h1, h2, h3, p, figure { margin: 0; }
    img { display: block; max-width: 100%; }
    .shell { width: min(1200px, 100%); margin-inline: auto; }
    .inner { width: min(1040px, calc(100% - 64px)); margin-inline: auto; }
    .skip { position: fixed; top: 8px; left: 8px; z-index: 4; padding: 8px 14px; background: var(--deep); transform: translateY(-150%); }
    .skip:focus { transform: none; }
    .masthead { background: var(--deep); border-bottom: 1px solid #496893; }
    .masthead-inner { position: relative; min-height: 82px; display: flex; align-items: center; justify-content: center; }
    .brand { display: inline-grid; justify-items: center; gap: 6px; text-align: center; text-decoration: none; }
    .brand-name { font: 800 1.06rem/1.1 var(--display); text-transform: uppercase; letter-spacing: .17em; }
    .brand-mark { display: flex; align-items: center; gap: 6px; }
    .brand-mark::before, .brand-mark::after { content: ''; width: 24px; height: 1px; background: #6f94c5; }
    .brand-mark i { width: 6px; height: 6px; border: 1px solid #b4cff5; transform: rotate(45deg); }
    .editor-open { position: absolute; right: 0; border: 1px solid var(--line); background: transparent; border-radius: 2px; color: var(--blue); padding: .43rem .75rem; font-size: .875rem; }
    .editor-open:hover, .secondary:hover { background: #243c5a; color: var(--ink); }
    .nav-band { background: var(--nav); border-bottom: 1px solid #6584a9; }
    .nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 0 clamp(6px, 1.7vw, 27px); padding-block: 1px; }
    .nav a { padding: 11px 4px 9px; border-bottom: 2px solid transparent; color: #e0eafa; font-size: .9rem; font-weight: 600; text-decoration: none; white-space: nowrap; }
    .nav a:hover, .nav a[aria-current] { border-color: #d9e8ff; color: #fff; }
    .hero { isolation: isolate; position: relative; min-height: 392px; display: grid; align-items: center; overflow: hidden; text-align: center; background: #172b4b var(--cover) center 53% / cover no-repeat; border-bottom: 1px solid #506a8a; }
    .hero::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(0deg, #060e1dd9, #07152b69 55%, #08142641), linear-gradient(90deg, #07102038, #0b193d67 48%, #07102038); }
    .hero::after { content: ''; position: absolute; inset: 13px; z-index: -1; border: 1px solid #cddcf44a; pointer-events: none; }
    .hero-copy { max-width: 960px; padding: 60px 24px 63px; margin-inline: auto; }
    .hero-overline { margin-bottom: 12px; display: flex; gap: 16px; align-items: center; justify-content: center; color: #e0eaff; font: italic 1.24rem/1.3 Georgia, serif; }
    .hero-overline::before, .hero-overline::after { content: ''; width: clamp(24px, 7vw, 90px); height: 1px; background: #c6dcfa9e; }
    .hero h1 { font: 900 clamp(2.9rem, 6.2vw, 5.15rem)/.98 var(--display); letter-spacing: -.065em; text-transform: uppercase; text-wrap: balance; text-shadow: 0 2px 24px #020917c9; overflow-wrap: anywhere; }
    .hero-text { max-width: 600px; margin: 18px auto 24px; color: #e2ebf9; white-space: pre-line; overflow-wrap: anywhere; }
    .primary, .secondary { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 9px 17px; border: 1px solid #a2bbdf; border-radius: 2px; background: #bad2f8; color: #0b172a; font-weight: 700; line-height: 1.3; text-decoration: none; }
    .primary:hover { background: #dce9ff; }
    .secondary { background: transparent; color: #e0ebfb; border-color: var(--line); }
    .index { padding-block: 35px 49px; }
    .index-heading { display: flex; gap: 16px; align-items: center; margin-bottom: 20px; }
    .index-heading::after { content: ''; height: 1px; flex: 1; background: var(--line); }
    .index h2 { font: 700 1.37rem/1.2 var(--display); text-transform: uppercase; letter-spacing: .05em; }
    .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .tile { position: relative; display: grid; text-decoration: none; border: 1px solid var(--line); padding: 6px; gap: 0; background: #101e35; }
    .tile:hover { border-color: #c3d7f6; background: #182d4b; }
    .tile-art { position: relative; isolation: isolate; min-height: 94px; display: grid; place-items: center; overflow: hidden; border: 1px solid #7391b7; background: #274669 var(--cover) center 70% / 235% auto no-repeat; color: #edf5ff; }
    .tile-art::before { content: ''; position: absolute; z-index: -1; inset: 0; background: linear-gradient(120deg, #10223bd9, #245385a8 90%); }
    .tile-art::after { content: ''; position: absolute; z-index: -1; inset: 5px; border: 1px solid #c4d7f553; }
    .tile:nth-child(3n + 1) .tile-art { background-position: left 74%; }
    .tile:nth-child(3n + 2) .tile-art { background-position: center 41%; }
    .tile:nth-child(3n) .tile-art { background-position: right 46%; }
    .tile:nth-child(even) .tile-art::before { background: linear-gradient(125deg, #1e5483b8, #101e38db); }
    .tile-symbol { font: 1.8rem/1 Georgia, serif; display: grid; place-items: center; width: 46px; height: 46px; border: 1px solid #c7dafaac; border-radius: 50%; }
    .tile-label { padding: 11px 4px 8px; text-align: center; font-size: .94rem; font-weight: 700; line-height: 1.24; }
    main { min-height: calc(100vh - 202px); }
    .section-cover { position: relative; isolation: isolate; padding-block: 58px 48px; text-align: center; border-bottom: 1px solid var(--line); background: #192f50 var(--cover) center 47% / cover no-repeat; }
    .section-cover::before { content: ''; position: absolute; inset: 0; z-index: -1; background: #0a1932cd; }
    .section-cover h1 { font: 900 clamp(2.2rem, 5.8vw, 4.3rem)/1.03 var(--display); text-transform: uppercase; letter-spacing: -.05em; text-wrap: balance; overflow-wrap: anywhere; }
    .section-cover p { max-width: 54ch; margin: 12px auto 0; color: #d7e5fa; white-space: pre-line; overflow-wrap: anywhere; }
    .section-content { padding-block: 36px 64px; }
    .empty { border: 1px dashed var(--line); background: var(--panel); padding: 34px 24px; text-align: center; }
    .empty p { margin-bottom: 16px; color: var(--muted); }
    .profile { display: grid; grid-template-columns: minmax(145px, 260px) minmax(0, 1fr); gap: 28px; align-items: start; padding: 22px; border: 1px solid var(--line); background: var(--panel); }
    .profile-photo { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border: 1px solid #6786ae; }
    .profile-placeholder { display: grid; place-items: center; color: var(--muted); background: #1c3353; }
    .profile h2, .entry h2 { font-size: 1.35rem; line-height: 1.22; overflow-wrap: anywhere; }
    .role { margin-top: 6px; color: var(--blue); overflow-wrap: anywhere; }
    .body-text { margin-top: 10px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
    .entries { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; gap: 18px; }
    .entry { min-width: 0; border: 1px solid var(--line); background: var(--panel); }
    .entry-media { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: #070f1d; border: 0; }
    video.entry-media { aspect-ratio: 16 / 9; object-fit: contain; }
    .entry-body { padding: 16px; }
    .entry-link { display: inline-block; margin-top: 12px; color: var(--blue); font-weight: 600; }
    .entry-photo { display: block; width: 100%; padding: 0; border: 0; background: transparent; }
    .entry-photo:hover img { opacity: .85; }
    .footer { border-top: 1px solid #283e5b; background: var(--deep); }
    .footer .inner { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 16px; color: var(--muted); font-size: .875rem; }
    .footer a { text-underline-offset: 3px; }
    dialog { width: min(720px, calc(100% - 24px)); max-height: calc(100% - 24px); padding: 0; border: 1px solid #57759b; color: var(--ink); background: var(--panel); box-shadow: 0 16px 65px #020713c9; }
    dialog::backdrop { background: #040a16c7; }
    .dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { font-size: 1.22rem; }
    .dialog-close { min-width: 40px; min-height: 38px; padding: 2px 9px; color: var(--ink); background: transparent; border: 1px solid var(--line); font-size: 1.4rem; }
    .dialog-body { padding: 18px 20px 21px; }
    .editor-intro, .help { color: var(--muted); font-size: .9rem; }
    .editor-intro { margin-bottom: 12px; }
    .fields { display: grid; gap: 13px; margin-top: 15px; }
    .field { display: grid; gap: 5px; color: #e2ecfb; font-size: .93rem; }
    input, textarea, select { min-width: 0; width: 100%; padding: 8px 10px; border-radius: 2px; border: 1px solid #506990; background: #0b1629; color: var(--ink); }
    textarea { min-height: 82px; resize: vertical; }
    input[type=file]::file-selector-button { padding: 5px 9px; margin-right: 8px; border: 0; border-radius: 2px; background: #2f4a70; color: var(--ink); cursor: pointer; }
    .image-editor { display: grid; gap: 6px; justify-items: start; }
    .image-editor img { width: 104px; max-height: 78px; object-fit: cover; }
    .image-editor .field { width: 100%; }
    .editor-entry { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line); }
    .editor-entry-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .editor-entry-head h3 { font-size: 1rem; }
    .quiet { color: var(--blue); background: transparent; border: 0; padding: 4px; text-decoration: underline; text-underline-offset: 3px; }
    .editor-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .editor-message { color: #d8e8ff; margin-top: 8px; }
    .editor-message:empty { display: none; }
    .photo-dialog { width: fit-content; max-width: min(1024px, calc(100% - 24px)); }
    .photo-dialog img { max-height: 72vh; object-fit: contain; margin-inline: auto; }
    .toast { position: fixed; right: 16px; bottom: 16px; z-index: 3; max-width: calc(100% - 32px); padding: 11px 16px; border: 1px solid #7598c7; background: var(--panel); color: var(--ink); }
    @media (min-width: 1240px) { .hero { border-inline: 1px solid var(--line); } }
    @media (max-width: 840px) { .inner { width: calc(100% - 36px); } .nav { gap: 0 14px; } .entries { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) {
      .masthead-inner { min-height: 72px; justify-content: space-between; gap: 8px; }
      .brand { justify-items: start; text-align: left; }
      .brand-name { max-width: 15ch; font-size: .87rem; letter-spacing: .1em; }
      .editor-open { position: static; }
      .nav { justify-content: flex-start; padding-inline: 0; gap: 0 12px; }
      .nav a { padding-block: 7px 5px; white-space: normal; }
      .hero { min-height: 335px; }
      .hero-copy { padding-inline: 25px; }
      .hero h1 { font-size: clamp(2.2rem, 10.6vw, 3.3rem); }
      .hero-overline { gap: 9px; font-size: 1.06rem; }
      .hero::after { inset: 8px; }
      .index { padding-top: 26px; }
      .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .tile-art { min-height: 72px; }
      .tile-label { overflow-wrap: anywhere; }
      .section-cover { padding-block: 43px 35px; }
      .profile, .entries { grid-template-columns: 1fr; }
      .profile-photo { max-width: 260px; }
    }
  </style>

        else node.setAttribute(name, value);
      }
      node.append(...children);
      return node;
    }

    function currentPage() {
      const hash = location.hash.slice(1);

      return Object.hasOwn(pages, hash) ? hash : 'home';

      try {
        const url = new URL(value);
        return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
      } catch { return ''; }
    }

    function imageURL(value) {
      return typeof value === 'string' && /^data:image\/(?:webp|jpeg|png);base64,[A-Za-z0-9+/=]+$/.test(value) ? value : '';
    }

    function imageNode(url, alt, className) {
      return element('img', { class: className, src: url, alt, loading: 'lazy' });
    }

    function editButton(label) {
      return element('button', { class: 'secondary', type: 'button', 'data-edit': '', text: label });
    }

    function renderHome() {
      const intro = element('div', { class: 'hero-copy' },
        element('p', { class: 'hero-overline', text: data.profile.name || 'Личный сайт учителя' }),
        element('h1', { text: data.home.title || 'Портфолио педагога' }),
        element('p', { class: 'hero-text', text: data.home.subtitle || 'Уроки, школьные проекты и работы учеников' }),
        element('a', { class: 'primary', href: '#sections', text: 'Смотреть разделы' }));
      const hero = element('section', { class: 'shell hero' }, intro);
      const cover = imageURL(data.home.cover);
      if (cover) hero.style.backgroundImage = `url(${cover})`;
      const tiles = element('div', { class: 'tiles' });
      for (const [key, page] of Object.entries(pages).slice(1)) {
        tiles.append(element('a', { class: 'tile', href: `#${key}` },
          element('span', { class: 'tile-art', 'aria-hidden': 'true' }, element('span', { class: 'tile-symbol', text: page.icon })),
          element('span', { class: 'tile-label', text: page.title })));
      }
      return [hero, element('section', { class: 'inner index', id: 'sections', tabindex: '-1' },
        element('div', { class: 'index-heading' }, element('h2', { text: 'Разделы портфолио' })), tiles)];
    }

    function emptySection(key) {
      return element('div', { class: 'empty' }, element('p', { text: pages[key].empty }), editButton(key === 'profile' ? 'Заполнить визитку' : pages[key].add));
    }

    function renderProfile() {
      const { name, role, text, image } = data.profile;
      if (!name && !role && !text && !image) return emptySection('profile');
      const url = imageURL(image);
      const portrait = url ? imageNode(url, name || 'Фото педагога', 'profile-photo') : element('div', { class: 'profile-photo profile-placeholder', text: 'Фото педагога' });
      const details = element('div');
      if (name) details.append(element('h2', { text: name }));
      if (role) details.append(element('p', { class: 'role', text: role }));
      if (text) details.append(element('p', { class: 'body-text', text }));
      return element('article', { class: 'profile' }, portrait, details);
    }

    function openPhoto(url, title) {
      $('#photo-title').textContent = title;
      $('#large-photo').src = url;
      $('#large-photo').alt = title;
      $('#photo-dialog').showModal();
    }

    function renderEntry(entry, key) {
      const card = element('article', { class: 'entry' });
      const url = safeURL(entry.url);
      const picture = imageURL(entry.image);
      const label = entry.title || (key === 'gallery' ? 'Фотография' : pages[key].title);
      const playable = key === 'videos' && url && /\.(mp4|webm|ogv)$/i.test(new URL(url).pathname);
      if (playable) {
        const video = element('video', { class: 'entry-media', controls: '', preload: 'none', playsinline: '', 'aria-label': label, src: url });
        if (picture) video.poster = picture;
        card.append(video);
      } else if (picture) {
        const img = imageNode(picture, '', 'entry-media');
        const view = element('button', { class: 'entry-photo', type: 'button', 'aria-label': `Увеличить изображение: ${label}` }, img);
        view.addEventListener('click', () => openPhoto(picture, label));
        card.append(view);
      }
      const body = element('div', { class: 'entry-body' });
      if (entry.title || !picture) body.append(element('h2', { text: label }));
      if (entry.text) body.append(element('p', { class: 'body-text', text: entry.text }));
      if (url && !playable) body.append(element('a', { class: 'entry-link', href: url, target: '_blank', rel: 'noopener noreferrer', text: key === 'videos' ? 'Смотреть видео' : 'Открыть материал' }));
      if (body.childElementCount) card.append(body);
      return card;
    }

    function renderSubpage(key) {
      const section = data.sections[key] || { intro: '', items: [] };
      const heading = element('div', { class: 'inner' }, element('h1', { text: pages[key].title }));
      if (section.intro) heading.append(element('p', { text: section.intro }));
      const cover = element('section', { class: 'section-cover shell' }, heading);
      const body = key === 'profile' ? renderProfile() : section.items.length
        ? element('div', { class: 'entries' }, ...section.items.map(item => renderEntry(item, key))) : emptySection(key);
      return [cover, element('section', { class: 'inner section-content' }, body)];
    }

    function render({ navigate = false } = {}) {
      const key = currentPage();
      $('.nav').replaceChildren(...Object.entries(pages).map(([id, page]) => {
        const link = element('a', { href: `#${id}`, text: page.title });
        if (id === key) link.setAttribute('aria-current', 'page');
        return link;
      }));
      main.replaceChildren(...(key === 'home' ? renderHome() : renderSubpage(key)));
      document.title = key === 'home' ? (data.home.title || 'Портфолио педагога') : `${pages[key].title} · Портфолио педагога`;
      if (!navigate) return;
      if (location.hash === '#sections') {
        $('#sections').focus({ preventScroll: true });
        $('#sections').scrollIntoView();
      } else {
        main.focus({ preventScroll: true });
        window.scrollTo(0, 0);
      }
    }

    function browserStorage(mode, operation) {
      return new Promise((resolve, reject) => {
        const open = indexedDB.open('teacher-portfolio', 1);
        open.onupgradeneeded = () => open.result.createObjectStore('drafts');
        open.onerror = () => reject(open.error);
        open.onblocked = () => reject(new Error('Хранилище занято'));
        open.onsuccess = () => {
          const db = open.result;
          const tx = db.transaction('drafts', mode);
          const request = operation(tx.objectStore('drafts'));
          tx.oncomplete = () => { db.close(); resolve(request.result); };
          tx.onabort = () => { db.close(); reject(tx.error); };
        };
      });
    }

    async function loadDraft() {
      try { return await browserStorage('readonly', store => store.get(draftKey)); }
      catch { try { return JSON.parse(localStorage.getItem(draftKey)); } catch { return null; } }
    }

    async function saveDraft(value) {
      try { await browserStorage('readwrite', store => store.put(value, draftKey)); }
      catch { localStorage.setItem(draftKey, JSON.stringify(value)); }
    }

    function textField(label, object, key, options = {}) {
      const input = element(options.multiline ? 'textarea' : 'input', options.url ? { type: 'url', placeholder: 'https://…' } : {});
      input.value = object[key] || '';
      input.addEventListener('input', () => { object[key] = input.value; });
      return element('label', { class: 'field' }, label, input);
    }

    async function readPhoto(file) {
      const temporary = URL.createObjectURL(file);
      try {
        const picture = new Image();
        picture.src = temporary;
        await picture.decode();
        const scale = Math.min(1, 1800 / Math.max(picture.naturalWidth, picture.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(picture.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(picture.naturalHeight * scale));
        canvas.getContext('2d').drawImage(picture, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/webp', .86);
      } finally { URL.revokeObjectURL(temporary); }
    }

    function photoField(label, object, key) {
      const input = element('input', { type: 'file', accept: '.jpg,.jpeg,.png,.webp,.avif,.gif,.bmp,image/*' });
      const preview = element('img', { alt: 'Предпросмотр фотографии' });
      const remove = element('button', { type: 'button', class: 'quiet', text: 'Убрать изображение' });
      function refresh() {
        const url = imageURL(object[key]);
        if (url) preview.src = url;
        else preview.removeAttribute('src');
        preview.hidden = remove.hidden = !url;
      }
      input.addEventListener('change', async () => {
        const file = input.files[0];
        if (!file) return;
        input.disabled = remove.disabled = true;
        pendingImages++;
        editorMessage.textContent = '';
        try { object[key] = await readPhoto(file); refresh(); }
        catch { editorMessage.textContent = 'Не удалось открыть изображение. Попробуйте файл JPG, PNG или WebP.'; }
        finally { pendingImages--; input.disabled = remove.disabled = false; input.value = ''; }
      });
      remove.addEventListener('click', () => { object[key] = ''; refresh(); });
      refresh();
      return element('div', { class: 'image-editor' }, element('label', { class: 'field' }, label, input), preview, remove);
    }

    function renderFields() {
      const key = editPage.value;
      editorMessage.textContent = '';
      if (key === 'home') {
        fields.replaceChildren(textField('Заголовок', editing.home, 'title'), textField('Короткий текст под заголовком', editing.home, 'subtitle', { multiline: true }), photoField('Фоновая фотография шапки', editing.home, 'cover'));
        return;
      }
      if (key === 'profile') {
        const profile = editing.profile;
        fields.replaceChildren(textField('Имя и фамилия', profile, 'name'), textField('Должность, предмет или школа', profile, 'role'), textField('О себе', profile, 'text', { multiline: true }), photoField('Портрет', profile, 'image'));
        return;
      }
      const section = editing.sections[key] ||= { intro: '', items: [] };
      const add = element('button', { type: 'button', class: 'secondary', text: pages[key].add });
      const list = element('div', { class: 'fields' });
      function entryFields(item) {
        const remove = element('button', { class: 'quiet', type: 'button', text: 'Удалить запись' });
        const group = element('div', { class: 'editor-entry' },
          element('div', { class: 'editor-entry-head' }, element('h3', { text: 'Запись' }), remove),
          textField(key === 'gallery' ? 'Подпись к фото' : 'Название', item, 'title'),
          textField('Описание', item, 'text', { multiline: true }),
          photoField(key === 'gallery' ? 'Фотография' : 'Изображение', item, 'image'));
        if (key !== 'gallery') group.append(textField(key === 'videos' ? 'Ссылка на видео' : 'Ссылка на материал', item, 'url', { url: true }));
        remove.addEventListener('click', () => {
          section.items.splice(section.items.indexOf(item), 1);
          group.remove();
          add.focus();
        });
        return group;
      }
      add.addEventListener('click', () => {
        const item = { title: '', text: '', image: '', url: '' };
        section.items.push(item);
        const group = entryFields(item);
        list.append(group);
        $('input', group).focus();
      });
      list.append(...section.items.map(entryFields));
      if (key === 'videos') fields.replaceChildren(textField('Вступительный текст раздела', section, 'intro', { multiline: true }), element('p', { class: 'help', text: 'Вставьте ссылку на видеоплатформу или прямую ссылку на MP4, WebM или OGV. По прямой ссылке ролик откроется в плеере на странице.' }), list, add);
      else fields.replaceChildren(textField('Вступительный текст раздела', section, 'intro', { multiline: true }), list, add);
    }

    function contentToSave() {
      if (pendingImages) {
        editorMessage.textContent = 'Подождите, пока обработается фотография.';
        return null;
      }
      const result = structuredClone(editing);
      for (const [key, section] of Object.entries(result.sections)) {
        if (section.items.some(item => item.url.trim() && !safeURL(item.url.trim()))) {
          editPage.value = key;
          renderFields();
          editorMessage.textContent = 'Введите полную ссылку, начинающуюся с https:// или http://.';
          return null;
        }
        section.items = section.items.filter(item => Object.values(item).some(value => value.trim()));
      }
      return result;
    }

    function notify(text) {
      const toast = $('.toast');
      clearTimeout(toastTimer);
      toast.textContent = text;
      toast.hidden = false;
      toastTimer = setTimeout(() => { toast.hidden = true; }, 4000);
    }

    const initialLoad = loadDraft().then(draft => {
      if (draft) { data = draft; render(); }
    });
    render();
    if (location.hash === '#sections') $('#sections').scrollIntoView();
    window.addEventListener('hashchange', () => render({ navigate: true }));
    $('.skip').addEventListener('click', event => {
      event.preventDefault();
      main.focus();
      main.scrollIntoView();
    });
    document.addEventListener('click', async event => {
      if (event.target.closest('[data-edit]')) {
        await initialLoad;
        if (editor.open) return;
        editing = structuredClone(data);
        editPage.value = currentPage();
        renderFields();
        editor.showModal();
      }
      if (event.target.closest('[data-close]')) event.target.closest('dialog').close();
    });
    editPage.append(...Object.entries(pages).map(([key, page]) => element('option', { value: key, text: page.title })));
    editPage.addEventListener('change', renderFields);
    $('#editor-form').addEventListener('submit', async event => {
      event.preventDefault();
      const result = contentToSave();
      if (!result) return;
      const save = $('#save-draft');
      save.disabled = true;
      try {
        await saveDraft(result);
        data = result;
        const target = editPage.value;
        editor.close();
        if (target === currentPage()) render();
        else location.hash = target;
        notify('Черновик сохранён');
      } catch { editorMessage.textContent = 'Браузер не сохранил черновик. Скачайте HTML, чтобы сохранить изменения.'; }
      finally { save.disabled = false; }
    });
    $('#download').addEventListener('click', () => {
      const result = contentToSave();
      if (!result) return;
      const copy = startingHTML.cloneNode(true);
      copy.dataset.draft = `teacher-portfolio-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
      $('#portfolio-data', copy).textContent = JSON.stringify(result).replace(/</g, '\\u003c');
      const blob = new Blob(['<!doctype html>\n', copy.outerHTML], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = element('a', { href: url, download: 'portfolio-pedagoga.html' });
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      editorMessage.textContent = 'HTML-файл скачивается. Его можно открыть в браузере.';
    });
  </script></body></html>
